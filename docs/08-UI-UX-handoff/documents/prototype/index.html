<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MakeMyMarrige — UI/UX Prototype v4</title>
<style>
:root{--bg:#faf8f4;--surface:#fff;--primary:#7a2e42;--accent:#bd9560;--text:#282522;--muted:#77716b;--border:#eae4da;--success:#287a52;--warning:#a96816;--danger:#b33a36;--shadow:0 8px 24px #38231a0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font:700 23px Georgia;color:var(--primary);padding:4px 10px 20px}.brand small{display:block;font:11px Inter;color:var(--muted);margin-top:5px}.workspace{background:#f8f4ed;border:1px solid var(--border);padding:11px;border-radius:12px;margin:0 4px 18px}.workspace b{display:block}.workspace small{color:var(--muted)}.navlabel{font-size:10px;color:var(--muted);letter-spacing:1.2px;padding:10px}.nav button{display:flex;width:100%;border:0;background:transparent;color:#514b46;padding:10px 12px;border-radius:9px;text-align:left;gap:10px;margin:2px 0}.nav button.active,.nav button:hover{background:#f4e6e6;color:var(--primary);font-weight:650}.nav .ico{width:18px}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:2}.top .right{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--border);padding:8px 12px;border-radius:99px;background:#fff;color:var(--muted)}.content{max-width:1440px;padding:28px;margin:auto}.eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}h1{font:600 28px Georgia;margin:6px 0;color:var(--primary)}.sub{color:var(--muted);margin:0 0 22px}.btn{border:1px solid var(--border);border-radius:9px;background:#fff;padding:10px 14px;color:var(--text)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.soft{background:#f6ebeb;color:var(--primary);border-color:#f0dcdc}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(5,minmax(0,1fr));margin:18px 0}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px;box-shadow:var(--shadow);min-width:0}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;font:600 24px Georgia;margin:8px 0 2px}.metric small{color:var(--muted)}.cols{grid-template-columns:1.3fr 1fr 1fr}.card h3{margin:0 0 14px;font:600 17px Georgia;color:var(--primary)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f0ece6}.row:last-child{border:0}.row small{display:block;color:var(--muted);margin-top:4px}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#f3eee8;color:#685e54;white-space:nowrap}.badge.good{background:#eaf4ed;color:var(--success)}.badge.warn{background:#fff2df;color:var(--warning)}.badge.bad{background:#fbeceb;color:var(--danger)}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:11px;border-bottom:1px solid var(--border)}.table td{padding:13px 11px;border-bottom:1px solid #f1ede8}.table tr:last-child td{border:0}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.toolbar input{border:1px solid var(--border);padding:10px 12px;border-radius:9px;min-width:220px}.kanban{grid-template-columns:repeat(4,minmax(0,1fr))}.task{border:1px solid var(--border);border-radius:10px;padding:12px;margin:9px 0;background:#fff}.task b{display:block;margin-bottom:6px}.task small{color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px;background:white}.field.full{grid-column:1/-1}.notice{background:#fff8eb;border:1px solid #f1dfbf;color:#76511d;padding:12px;border-radius:10px;margin:12px 0}.empty{padding:34px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.guest{max-width:460px;margin:24px auto;background:#fff;border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.guesthead{background:#f7ece7;padding:28px;text-align:center}.guesthead h2{font:26px Georgia;color:var(--primary)}.guestbody{padding:22px}.event{background:#fbf7f0;border-radius:12px;padding:15px;margin:10px 0}.mobilebar{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#282522;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:9}.modalback{display:none;position:fixed;inset:0;background:#1e171766;z-index:10;align-items:center;justify-content:center;padding:18px}.modal{background:white;border-radius:16px;padding:22px;width:min(520px,100%);box-shadow:0 20px 60px #0003}.modal h3{color:var(--primary);font:22px Georgia}.modal .actions{justify-content:flex-end;margin-top:18px}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.side{display:none}.top{height:58px;padding:0 14px}.content{padding:18px 14px 84px}h1{font-size:24px}.metrics{grid-template-columns:repeat(2,1fr);gap:9px}.metric strong{font-size:20px}.cols{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:5}.mobilebar button{border:0;background:none;color:var(--muted);font-size:11px}.mobilebar button.active{color:var(--primary);font-weight:700}.tablewrap{overflow:auto}.table{min-width:600px}.top .right .pill{display:none}}
</style></head><body>
<div class="app" id="workspace">
<aside class="side"><div class="brand">✿ MakeMyMarrige<small>Plan · Coordinate · Celebrate Together</small></div><div class="workspace"><b>Riya & Arjun</b><small>Wedding workspace ▾</small></div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
<button class="active" data-page="Dashboard"><span class="ico">⌂</span>Dashboard</button><button data-page="Functions"><span class="ico">▦</span>Functions</button><button data-page="Tasks"><span class="ico">☷</span>Tasks</button><button data-page="Guests"><span class="ico">♙</span>Guests & Households</button><button data-page="RSVP"><span class="ico">✓</span>RSVP</button><button data-page="Budget"><span class="ico">₹</span>Budget & Expenses</button><button data-page="Vendors"><span class="ico">◇</span>Vendors</button><button data-page="Shagun"><span class="ico">♡</span>Digital Shagun</button><button data-page="Gallery"><span class="ico">▧</span>Gallery</button><button data-page="Approvals"><span class="ico">◎</span>Approvals</button><button data-page="Team"><span class="ico">♧</span>Team & Permissions</button><button data-page="Notifications"><span class="ico">♢</span>Notifications</button><button data-page="Audit"><span class="ico">≡</span>Audit Log & Security</button><button data-page="Settings"><span class="ico">⚙</span>Settings</button>
</nav></aside>
<main class="main"><header class="top"><div><b id="topTitle">Wedding Workspace</b> <span style="color:var(--muted)">/ <span id="crumb">Dashboard</span></span></div><div class="right"><button class="btn" onclick="toggleGuest()">Guest portal preview</button><span class="pill">🔔 3</span><span class="pill">Riya · Co-owner</span></div></header><section class="content" id="content"></section></main></div>
<div class="mobilebar" id="mobilebar"><button class="active" data-page="Dashboard">⌂<br>Home</button><button data-page="Functions">▦<br>Events</button><button data-page="Tasks">☷<br>Tasks</button><button data-page="Guests">♙<br>Guests</button><button data-page="More">•••<br>More</button></div>
<div class="toast" id="toast"></div><div class="modalback" id="modalback"><div class="modal"><h3 id="modalTitle">Confirm action</h3><p id="modalText">Please review this action.</p><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmModal()">Confirm</button></div></div></div>
<script>
const pages={
Dashboard:`<div class="eyebrow">CO-OWNER OVERVIEW</div><h1>Good morning, Riya</h1><p class="sub">Here’s what needs your attention across the wedding workspace.</p><div class="grid metrics">${[['Functions','12','Across the wedding'],['Guests','248','Invited guests'],['RSVPs','186','75% responded'],['Total budget','₹8.40 L','Planned budget'],['Spent','₹5.17 L','62% of budget']].map(x=>`<div class="card metric"><span class="label">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="grid cols"><div class="card"><h3>Needs attention</h3><div class="row"><div><b>Expense approval</b><small>Venue advance · ₹1,20,000</small></div><span class="badge warn">Awaiting review</span></div><div class="row"><div><b>Overdue task</b><small>Confirm decorator vendor</small></div><span class="badge bad">2 days overdue</span></div><div class="row"><div><b>Guest correction</b><small>Phone number update requested</small></div><span class="badge">Review</span></div></div><div class="card"><h3>Upcoming functions</h3><div class="row"><div><b>Mehendi</b><small>21 Feb · 4:00 PM</small></div><span class="badge good">Published</span></div><div class="row"><div><b>Haldi</b><small>22 Feb · 10:00 AM</small></div><span class="badge good">Published</span></div><div class="row"><div><b>Sangeet</b><small>24 Feb · 7:00 PM</small></div><span class="badge warn">Draft</span></div></div><div class="card"><h3>Quick actions</h3><div class="actions"><button class="btn primary" onclick="showToast('Create task flow is a prototype action')">＋ Add task</button><button class="btn" onclick="go('Guests')">Add guest</button><button class="btn" onclick="go('Approvals')">Review approvals</button><button class="btn" onclick="go('Gallery')">Upload photos</button></div></div></div>`,
Functions:`<div class="eyebrow">EVENT OPERATIONS</div><h1>Functions</h1><p class="sub">Manage schedules, venues, invitees and guest-facing publication.</p><div class="toolbar"><input placeholder="Search functions…" oninput="filterRows(this.value)"><button class="btn primary" onclick="showToast('Create function flow — connect to API during implementation')">＋ Create function</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>Function</th><th>Date & time</th><th>Venue</th><th>Invited</th><th>Status</th><th></th></tr></thead><tbody id="filterBody">${[['Mehendi','21 Feb · 4:00 PM','Shree Palace','186','Published'],['Haldi','22 Feb · 10:00 AM','Home venue','142','Published'],['Sangeet','24 Feb · 7:00 PM','Shree Palace','248','Draft'],['Wedding Ceremony','25 Feb · 7:00 PM','Shree Palace','248','Pending approval']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="badge ${r[4]==='Published'?'good':'warn'}">${r[4]}</span></td><td><button class="btn" onclick="showToast('Open function detail')">View</button></td></tr>`).join('')}</tbody></table></div><div class="notice">Guest portal displays published function snapshots only. Publishing and cancellation require dual co-owner approval.</div>`,
Tasks:`<div class="eyebrow">PLANNING OPERATIONS</div><h1>Tasks</h1><p class="sub">Every task belongs to a function or General wedding planning, has one responsible owner and a checklist.</p><div class="toolbar"><div class="actions"><button class="btn soft">Board</button><button class="btn">List</button><button class="btn">Calendar</button></div><button class="btn primary" onclick="showToast('Create task form is represented in the handoff specification')">＋ Create task</button></div><div class="grid kanban">${[['To do',[['Confirm decorator vendor','Sangeet · Due 18 Feb','High'],['Finalise guest list','General · Due 19 Feb','Medium']]],['In progress',[['Print invitation cards','Wedding · Due 20 Feb','Medium']]],['Blocked',[['Confirm stage layout','Sangeet · Waiting for vendor','High']]],['Completed',[['Book photographer','Wedding · Completed','Done']]]].map(c=>`<div class="card"><h3>${c[0]} <span class="badge">${c[1].length}</span></h3>${c[1].map(t=>`<div class="task"><b>${t[0]}</b><small>${t[1]}</small><p><span class="badge ${t[2]==='High'?'warn':'good'}">${t[2]}</span></p><button class="btn" onclick="showToast('Task detail opened in prototype')">Open task</button></div>`).join('')}</div>`).join('')}</div>`,
Guests:`<div class="eyebrow">PEOPLE & HOUSEHOLDS</div><h1>Guests & households</h1><p class="sub">Manage individual guest records, household membership and function invitations.</p><div class="toolbar"><input placeholder="Search guests…"><button class="btn primary" onclick="showToast('Add guest form — see screen-level specification')">＋ Add guest</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>Guest</th><th>Household</th><th>Contact</th><th>Primary tag</th><th>RSVP</th></tr></thead><tbody>${[['Aarav Sharma','Sharma family','Verified','Family','Attending'],['Meera Verma','Verma family','Verified','Friend','Pending'],['Kabir Singh','Singh family','Unverified','Colleague','Declined'],['Anaya Gupta','Gupta family','Verified','Family','Attending']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="badge">${r[4]}</span></td></tr>`).join('')}</tbody></table></div>`,
RSVP:`<div class="eyebrow">GUEST RESPONSES</div><h1>RSVP overview</h1><p class="sub">Responses are individual per guest per function; household totals are rollups.</p><div class="grid metrics">${[['Invited','248'],['Attending','186'],['Declined','24'],['Pending','38']].map(x=>`<div class="card metric"><span class="label">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="card"><h3>Function response summary</h3>${[['Mehendi','164 / 186','88%'],['Haldi','126 / 142','89%'],['Sangeet','174 / 248','70%'],['Wedding','142 / 248','57%']].map(r=>`<div class="row"><div><b>${r[0]}</b><small>${r[1]} responses</small></div><span class="badge good">${r[2]}</span></div>`).join('')}</div>`,
Budget:`<div class="eyebrow">FINANCIAL CONTROL</div><h1>Budget & expenses</h1><p class="sub">Finance view is restricted to co-owners and the Treasurer.</p><div class="grid metrics">${[['Planned','₹8.40 L'],['Committed','₹6.10 L'],['Paid','₹5.17 L'],['Remaining','₹3.23 L']].map(x=>`<div class="card metric"><span class="label">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="card"><h3>Recent expenses</h3>${[['Venue advance','₹1,20,000','Pending approval'],['Catering booking','₹2,40,000','Approved'],['Photography','₹85,000','Paid']].map(r=>`<div class="row"><div><b>${r[0]}</b><small>${r[1]}</small></div><span class="badge ${r[2]==='Paid'?'good':'warn'}">${r[2]}</span></div>`).join('')}</div><div class="notice">Amounts are stored in integer paise. Ordinary expense approval is Treasurer-only; Treasurer-created/beneficiary expenses require both co-owners.</div>`,
Vendors:`<div class="eyebrow">VENDOR MANAGEMENT</div><h1>Vendors</h1><p class="sub">Discovery, shortlist, comparison, selection and booking are separate states.</p><div class="toolbar"><input placeholder="Search vendor or category…"><button class="btn primary" onclick="showToast('Add manual vendor record')">＋ Add vendor</button></div><div class="grid cols">${[['Shree Palace Banquet','Venue · Kanpur','Shortlisted'],['Swar Sangeet Events','Music · Kanpur','Comparing'],['LensCraft Studio','Photography · Kanpur','Selected']].map(r=>`<div class="card"><h3>${r[0]}</h3><p class="sub">${r[1]}</p><span class="badge warn">${r[2]}</span><p><small>Source: Google Places / manually maintained</small></p><button class="btn" onclick="showToast('Vendor details opened')">View details</button></div>`).join('')}</div><div class="notice">A selected vendor is not automatically booked. A quote is not a contract.</div>`,
Shagun:`<div class="eyebrow">DIGITAL CONTRIBUTIONS</div><h1>Digital Shagun</h1><p class="sub">Razorpay integration direction selected · UPI only.</p><div class="grid cols"><div class="card"><h3>Recipient destination</h3><b>UPI destination</b><p class="sub">••••••••@upi</p><span class="badge good">Dual-approved</span></div><div class="card"><h3>Contributions</h3><strong style="font:28px Georgia">₹35,000</strong><p class="sub">Provider-verified contributions</p><span class="badge good">Reconciled</span></div><div class="card"><h3>Payment controls</h3><p>Server-side order creation, signature verification, webhook verification and idempotency.</p><span class="badge warn">Provider setup required</span></div></div><div class="notice">A redirect, screenshot or client-entered reference is never proof of payment. Pending remains pending until server verification.</div>`,
Gallery:`<div class="eyebrow">PRIVATE MEDIA</div><h1>Gallery</h1><p class="sub">Approved photos are visible to invited guests; uploads remain private until approved where required.</p><div class="toolbar"><div class="actions"><button class="btn soft">All functions</button><button class="btn">Pending moderation</button></div><button class="btn primary" onclick="showToast('Upload: JPG/PNG · max 5 MB per file')">＋ Upload photos</button></div><div class="grid cols">${['Mehendi album','Haldi album','Sangeet album'].map((x,i)=>`<div class="card"><div style="height:120px;border-radius:10px;background:linear-gradient(135deg,#f4e2d7,#d5b18c);display:grid;place-items:center;font-size:34px">✿</div><h3 style="margin-top:12px">${x}</h3><p class="sub">${[28,16,0][i]} approved photos</p><span class="badge">${i===2?'No photos yet':'Approved'}</span></div>`).join('')}</div><div class="notice">JPG/PNG only · 5 MB per file · guest max 5 per batch · co-owner/organiser max 10 per batch. Workspace quota and dimension ceiling remain configurable release settings.</div>`,
Approvals:`<div class="eyebrow">WORKSPACE GOVERNANCE</div><h1>Approvals</h1><p class="sub">High-impact changes require two distinct co-owner accounts.</p><div class="card">${[['Publish Sangeet function','Initiated by Riya · 1 of 2 approvals','Awaiting second'],['Appoint organiser','Initiated by Arjun · 1 of 2 approvals','Awaiting second'],['Venue advance expense','₹1,20,000 · Treasurer review','Pending']].map(r=>`<div class="row"><div><b>${r[0]}</b><small>${r[1]}</small></div><div class="actions"><span class="badge warn">${r[2]}</span><button class="btn" onclick="showToast('Proposal snapshot opened')">Review</button></div></div>`).join('')}</div><div class="notice">The proposal snapshot is immutable. The initiator may count as first approval; the second approval must be from a distinct co-owner account.</div>`,
Team:`<div class="eyebrow">ACCESS CONTROL</div><h1>Team & permissions</h1><p class="sub">Organiser grants use resource + action + optional function-level scope.</p><div class="card">${[['Riya Sharma','Co-owner','Full governance'],['Arjun Pandey','Co-owner','Full governance'],['Neha Verma','Treasurer','Finance operations'],['Rohan Verma','Organiser','Functions: Mehendi, Sangeet']].map(r=>`<div class="row"><div><b>${r[0]}</b><small>${r[2]}</small></div><span class="badge">${r[1]}</span></div>`).join('')}</div><div class="notice">Do not infer access from role labels alone. Server-side policy remains authoritative.</div>`,
Notifications:`<div class="eyebrow">UPDATES</div><h1>Notifications</h1><div class="card">${[['Expense approval requested','10:24 AM','Finance'],['Task assigned to you','9:15 AM','Tasks'],['New RSVP received','Yesterday','Guests']].map(r=>`<div class="row"><div><b>${r[0]}</b><small>${r[1]}</small></div><span class="badge">${r[2]}</span></div>`).join('')}</div>`,
Audit:`<div class="eyebrow">SECURITY & ACCOUNTABILITY</div><h1>Audit log</h1><p class="sub">Append-only event history. Co-owner access only.</p><div class="card">${[['Expense approved','Neha Verma · Treasurer','10:22 AM'],['Permission changed','Riya Sharma · Co-owner','Yesterday'],['Login from new device','Riya Sharma','Yesterday']].map(r=>`<div class="row"><div><b>${r[0]}</b><small>${r[1]}</small></div><span class="badge">${r[2]}</span></div>`).join('')}</div>`,
Settings:`<div class="eyebrow">WORKSPACE CONFIGURATION</div><h1>Settings</h1><div class="grid cols"><div class="card"><h3>Wedding profile</h3><p>Wedding name, date, venue and locale.</p><span class="badge">Asia/Kolkata</span></div><div class="card"><h3>Security</h3><p>Sessions, account security and provider connections.</p><button class="btn" onclick="showToast('Session management panel')">Manage sessions</button></div><div class="card"><h3>Lifecycle</h3><p>Post-wedding deletion and backup policy.</p><span class="badge warn">Legal review required</span></div></div>`,
More:`<div class="eyebrow">MORE MODULES</div><h1>Workspace</h1><p class="sub">Choose a workspace area.</p><div class="grid cols">${['Budget','Vendors','Shagun','Gallery','Approvals','Team','Notifications','Audit','Settings'].map(x=>`<button class="card" onclick="go('${x}')" style="text-align:left"><h3>${x}</h3><small>Open module →</small></button>`).join('')}</div>`
};
let current='Dashboard',isGuest=false,modalAction=null;
function render(){document.getElementById('crumb').textContent=current;document.getElementById('topTitle').textContent=isGuest?'Guest portal preview':'Wedding Workspace';document.getElementById('content').innerHTML=pages[current]||pages.Dashboard;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));}
function go(p){if(p==='More')p='More';current=p;isGuest=false;document.getElementById('workspace').style.display='grid';render();}
function toggleGuest(){isGuest=!isGuest;if(isGuest){document.getElementById('workspace').style.display='block';document.getElementById('content').innerHTML=`<div class="guest"><div class="guesthead"><div style="font-size:32px;color:var(--primary)">✿</div><div class="eyebrow">YOU’RE INVITED</div><h2>Riya & Arjun</h2><p>Wedding Celebration · 21–25 Feb 2027</p><span class="badge good">Verified guest preview</span></div><div class="guestbody"><div class="event"><b>Mehendi</b><p>21 Feb · 4:00 PM</p><small>Shree Palace Banquet, Kanpur</small></div><div class="event"><b>Haldi</b><p>22 Feb · 10:00 AM</p><small>Home venue</small></div><h3 style="color:var(--primary)">Your RSVP</h3><p>Mehendi · Please respond</p><div class="actions"><button class="btn primary" onclick="showToast('RSVP: Attending selected')">Attending</button><button class="btn" onclick="showToast('RSVP: Declined selected')">Can’t attend</button></div><div class="event"><b>Gallery</b><p>Approved photos from your invited functions.</p><button class="btn" onclick="showToast('Guest gallery opened')">View gallery</button></div><div class="event"><b>Digital Shagun</b><p>UPI contribution through secure provider checkout.</p><button class="btn primary" onclick="showToast('UPI-only payment handoff preview')">Contribute</button></div></div></div>`;document.getElementById('topTitle').textContent='Guest portal preview';document.getElementById('crumb').textContent='Mobile-first guest view';}else{document.getElementById('workspace').style.display='grid';render();}}
function showToast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}
function askConfirm(title,text,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;modalAction=fn;document.getElementById('modalback').style.display='flex'}
function closeModal(){document.getElementById('modalback').style.display='none'}
function confirmModal(){closeModal();if(modalAction)modalAction()}
function filterRows(q){document.querySelectorAll('#filterBody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
render();
</script></body></html>
