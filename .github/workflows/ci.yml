
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --wait --wait-timeout 60

      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml ps -a
          docker compose -f infrastructure/docker/docker-compose.yml logs --no-color mongo redis

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
